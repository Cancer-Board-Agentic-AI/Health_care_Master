services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./knowledge:/app/knowledge"]
    depends_on: [ollama]
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ANONYMIZED_TELEMETRY=FALSE
  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports: ["8501:8501"]
    volumes: ["./knowledge:/app/knowledge"]
    depends_on: [api]
    environment:
      - MEDICAL_API_URL=http://api:8000
volumes:
  ollama:
